<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>내 캐릭터 만들기 — 공원 원정대</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e6b34">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    background: #cfe3d2; display: flex; justify-content: center;
  }
  #frame {
    position: relative; width: 100%; max-width: 480px; min-height: 100dvh;
    background: linear-gradient(#bfe3f2, #eaf6e6 60%); overflow-y: auto;
    box-shadow: 0 0 24px rgba(0,0,0,.12); padding: 14px 16px 24px;
  }
  /* 화면 본체(미리보기·옵션 패널·저장)는 js/creator.js가 그린다 — 지도 첫 진입 모달과 같은 화면 */
  #backLink { display: block; text-align: center; margin-top: 12px; font-size: 12px; color: #7ba381; }
  /* 🌐 언어 버튼(js/i18n.js)은 지도 화면 기준 좌표라 여기선 머리말과 겹친다 → 오른쪽 아래로 */
  /* i18n.js가 나중에 붙이는 규칙보다 뒤에 오려면 선택자를 한 단계 더 자세히 (body 추가) */
  body #langBtn { position: fixed; top: auto; left: auto; bottom: 20px; right: 16px; width: 48px; height: 48px; font-size: 20px; }
</style>
</head>
<body>
<script>
/* 지도 화면 '가' 버튼의 글씨 크기 설정을 이 페이지에도 반영 */
(function () {
  var v = parseInt(localStorage.getItem('quest.fontscale.v1'), 10) || 0;
  if (v) document.documentElement.style.zoom = v === 1 ? 1.15 : 1.32;
})();
</script>
<div id="frame">
  <div id="creatorRoot"></div>
  <a id="backLink" href="index.html">저장 없이 지도로 돌아가기</a>
</div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import { mountCreator } from './js/creator.js';
import { initAuthUI } from './js/auth-ui.js';
import { initAutoSync } from './js/account.js';

initAuthUI();
initAutoSync();
mountCreator(document.getElementById('creatorRoot'), {
  onSave: () => { location.href = 'index.html'; },
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script src="js/i18n.js"></script>
</body>
</html>
