<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>나의 공원 탐험 유형 — 공원 원정대</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧢</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e6b34">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="이동 패턴 4가지 × 탐험 성향 4가지 = 16가지 탐험 유형. 나만의 캐릭터를 만나 보세요!">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    background: #f4f6f0; display: flex; justify-content: center;
  }
  #page {
    width: 100%; max-width: 1080px; min-height: 100dvh; padding: 0 14px 40px;
  }
  header { padding: 20px 4px 4px; }
  header h1 { font-size: 21px; color: #2e6b34; }
  header p { font-size: 12.5px; color: #6a8a70; margin-top: 5px; line-height: 1.55; }
  header .nav { margin-top: 8px; font-size: 12px; }
  header .nav a { color: #2e6b34; font-weight: 700; text-decoration: none; margin-right: 12px; }

  /* 필터 바 */
  #controls {
    position: sticky; top: 0; z-index: 5; background: #f4f6f0ee; backdrop-filter: blur(4px);
    padding: 10px 0 8px; border-bottom: 1px solid #e2e8dd;
  }
  .ctlRow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ctlLabel { font-size: 11px; font-weight: 800; color: #7ba381; width: 58px; flex: none; }
  #genderToggle { display: flex; gap: 6px; }
  #genderToggle button, .fchip {
    border: 2px solid #dfe8da; border-radius: 14px; background: #fff; cursor: pointer;
    font-size: 13px; font-weight: 700; color: #556; padding: 8px 13px; min-height: 38px;
  }
  #genderToggle button[aria-pressed="true"], .fchip[aria-pressed="true"] {
    border-color: #2e6b34; background: #eef7e8; color: #2e6b34;
  }

  /* 카드 그리드 — 모바일 2열 / 태블릿 2~3열 / 데스크톱 4열 */
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
  @media (min-width: 700px) { #grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1000px) { #grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 359px) { #grid { grid-template-columns: 1fr; } }

  .card {
    background: #fff; border-radius: 18px; overflow: hidden; text-align: center;
    border: 2px solid transparent; box-shadow: 0 2px 10px rgba(0,0,0,.07);
    display: flex; flex-direction: column;
  }
  .card .band { height: 8px; }
  .card .avatarWrap { display: flex; justify-content: center; padding: 12px 0 4px; }
  .card h3 { font-size: 15px; color: #223; padding: 4px 8px 0; }
  .card .animal { font-size: 11.5px; color: #6a8a70; font-weight: 700; margin-top: 2px; }
  .card .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 7px 8px 0; }
  .card .badges span {
    font-size: 10px; font-weight: 700; border-radius: 8px; padding: 3px 7px;
    background: #f0f4ee; color: #556;
  }
  .card .desc {
    font-size: 11.5px; color: #556; line-height: 1.5; padding: 8px 12px 0; flex: 1;
  }
  .card .more {
    margin: 10px 12px 12px; border: 0; border-radius: 12px; min-height: 40px;
    font-size: 13px; font-weight: 800; color: #fff; cursor: pointer;
  }

  /* 상세 모달 */
  #modalWrap { position: fixed; inset: 0; z-index: 20; display: none; }
  #modalWrap.open { display: block; }
  #modalBack { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  #modal {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(430px, calc(100% - 28px)); max-height: 88dvh; overflow-y: auto;
    background: #fff; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #modal .mHead { padding: 22px 20px 8px; text-align: center; color: #fff; }
  #modal .mHead .sub { font-size: 12px; opacity: .9; font-weight: 700; }
  #modal .mHead h2 { font-size: 22px; margin-top: 2px; }
  #modal .mAvatar { display: flex; justify-content: center; padding: 14px 0 6px; }
  #modal .mBody { padding: 6px 20px 20px; }
  #modal .mDesc { font-size: 14px; color: #334; line-height: 1.6; text-align: center; margin-top: 6px; }
  #modal .mRow {
    display: flex; gap: 8px; margin-top: 8px; background: #f7faf4; border: 1px solid #e4eede;
    border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: #445; line-height: 1.5;
  }
  #modal .mRow b { flex: none; width: 74px; color: #2e6b34; font-size: 12px; }
  #modal .kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
  #modal .kws span { font-size: 11.5px; font-weight: 700; border-radius: 10px; padding: 4px 10px; color: #fff; }
  #modal .mBtns { display: flex; gap: 8px; margin-top: 14px; }
  #modal .mBtns button {
    flex: 1; border: 0; border-radius: 14px; min-height: 48px; font-size: 14px;
    font-weight: 800; cursor: pointer;
  }
  #modalClose2 { background: #f0f4ee; color: #556; }
  #modalGo { color: #fff; }
  #modalX {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 0;
    border-radius: 50%; background: rgba(0,0,0,.25); color: #fff; font-size: 15px; cursor: pointer;
  }
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #333c; color: #fff; font-size: 12px; border-radius: 20px;
    padding: 8px 16px; z-index: 30; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="page">
  <header>
    <h1>🧢 나의 공원 탐험 유형</h1>
    <p>공원을 어떻게 돌아다녔는지(이동 패턴)와 어떤 탐험을 좋아하는지(탐험 성향)에 따라
    16가지 유형이 있어요. 남자·여자 캐릭터까지 모두 32명! 마음에 드는 캐릭터로 탐험을 떠나 보세요.</p>
    <p class="nav"><a href="index.html">🗺️ 지도로 돌아가기</a><a href="customize.html">👕 내 캐릭터 꾸미기</a></p>
  </header>

  <div id="controls">
    <div class="ctlRow">
      <span class="ctlLabel" id="genderLabel">캐릭터</span>
      <div id="genderToggle" role="group" aria-labelledby="genderLabel">
        <button data-g="m" aria-pressed="true">👦 남자 캐릭터</button>
        <button data-g="f" aria-pressed="false">👧 여자 캐릭터</button>
      </div>
    </div>
    <div class="ctlRow">
      <span class="ctlLabel" id="moveLabel">이동 유형</span>
      <div role="group" aria-labelledby="moveLabel" id="moveFilter"></div>
    </div>
    <div class="ctlRow">
      <span class="ctlLabel" id="missionLabel">탐험 성향</span>
      <div role="group" aria-labelledby="missionLabel" id="missionFilter"></div>
    </div>
  </div>

  <div id="grid" aria-live="polite"></div>
</div>

<div id="modalWrap">
  <div id="modalBack"></div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button id="modalX" aria-label="닫기">✕</button>
    <div class="mHead" id="modalHead">
      <div class="sub" id="modalSub"></div>
      <h2 id="modalName"></h2>
    </div>
    <div class="mAvatar" id="modalAvatar"></div>
    <div class="mBody">
      <p class="mDesc" id="modalDesc"></p>
      <div class="mRow"><b>이동 패턴</b><span id="modalMove"></span></div>
      <div class="mRow"><b>탐험 성향</b><span id="modalMission"></span></div>
      <div class="mRow"><b>대표 소품</b><span id="modalProps"></span></div>
      <div class="kws" id="modalKws"></div>
      <div class="mBtns">
        <button id="modalClose2">닫기</button>
        <button id="modalGo">🧭 이 캐릭터로 탐험하기</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import { MOVEMENT_TYPES, MISSION_TYPES, ALL_COMBOS, getCharacter, iEyo } from './js/explorer-types.mjs';
import { characterAvatarEl } from './js/type-card.js';
import { renderCharacterImage } from './js/type-render.js';
import { loadAvatar, saveAvatar } from './js/character.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let gender = loadAvatar().gender || 'm'; // 내 캐릭터 성별로 시작
let moveSel = 'all', missionSel = 'all';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.remove('show'), 2600);
}

/* 도감 캐릭터 이미지 — ①img/characters/{id}.webp(파일 준비 시 HAS_WEBP를 true로) ②치비 렌더 ③동물 이모지 폴백 */
const HAS_WEBP = true; // img/characters/*.webp 32장 준비됨 (시트에서 추출한 일러스트)
function loadImg(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}
const imgPromises = new Map();
function characterImage(ch) {
  if (!imgPromises.has(ch.id)) {
    imgPromises.set(ch.id, (async () => (
      (HAS_WEBP ? await loadImg(ch.imagePath) : null)
      /* 도감 표준 복장: 여자 캐릭터는 원피스 실루엣으로 구분 (색·성격은 남녀 동일) */
      || await renderCharacterImage({ gender: ch.gender, dress: ch.gender === 'f', top: 0, bottom: 0, gear: ch.comboId })
    ))());
  }
  return imgPromises.get(ch.id);
}

/* ── 필터 칩 ── */
function renderFilterChips(el, defs, sel, onPick) {
  el.innerHTML = '';
  el.style.display = 'flex';
  el.style.gap = '6px';
  el.style.flexWrap = 'wrap';
  const all = [{ id: 'all', title: '전체', animalEmoji: '' }, ...defs];
  for (const d of all) {
    const b = document.createElement('button');
    b.className = 'fchip';
    b.textContent = d.id === 'all' ? '전체' : `${d.animalEmoji || d.propEmoji} ${d.title}`;
    b.setAttribute('aria-pressed', String(sel === d.id));
    b.addEventListener('click', () => onPick(d.id));
    el.appendChild(b);
  }
}

function syncControls() {
  for (const b of $('genderToggle').children) b.setAttribute('aria-pressed', String(b.dataset.g === gender));
  renderFilterChips($('moveFilter'), MOVEMENT_TYPES, moveSel, (id) => { moveSel = id; syncControls(); renderGrid(); });
  renderFilterChips($('missionFilter'), MISSION_TYPES, missionSel, (id) => { missionSel = id; syncControls(); renderGrid(); });
}
for (const b of $('genderToggle').children) {
  b.addEventListener('click', () => { gender = b.dataset.g; syncControls(); renderGrid(); });
}

/* ── 카드 그리드 ── */
function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const combos = ALL_COMBOS.filter((c) =>
    (moveSel === 'all' || c.movementType === moveSel) && (missionSel === 'all' || c.missionType === missionSel));
  for (const combo of combos) {
    const ch = getCharacter(combo.movementType, combo.missionType, gender);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderColor = combo.secondaryColor;
    card.innerHTML = `
      <div class="band" style="background:${combo.primaryColor}"></div>
      <div class="avatarWrap"></div>
      <h3>${combo.typeNumber}. ${esc(combo.koreanName)}</h3>
      <div class="animal">${combo.animalEmoji} ${esc(combo.animal)} 친구</div>
      <div class="badges">
        <span>🚶 ${esc(combo.moveLabel)}</span>
        <span>⏱️ ${esc(combo.stayLabel)}</span>
        <span style="background:${combo.secondaryColor};color:#334">${esc(combo.missionLabel)}</span>
      </div>
      <p class="desc">${esc(combo.description)}</p>
      <button class="more" style="background:${combo.primaryColor}" aria-label="${esc(combo.koreanName)} 자세히 보기">자세히 보기</button>`;
    card.querySelector('.avatarWrap').appendChild(characterAvatarEl({
      combo, imgPromise: characterImage(ch), size: 108,
    }));
    card.querySelector('.more').addEventListener('click', (e) => openModal(combo, e.currentTarget));
    grid.appendChild(card);
  }
}

/* ── 상세 모달 (focus trap · ESC · 포커스 복귀) ── */
let lastFocus = null, curCombo = null;
const wrap = $('modalWrap'), modal = $('modal');

function openModal(combo, opener) {
  curCombo = combo;
  lastFocus = opener || document.activeElement;
  const ch = getCharacter(combo.movementType, combo.missionType, gender);
  $('modalHead').style.background = `linear-gradient(${combo.primaryColor}, ${combo.primaryColor}dd)`;
  $('modalSub').textContent = `${combo.typeNumber}번 유형 · ${ch.genderLabel}`;
  $('modalName').textContent = `${combo.animalEmoji} ${combo.koreanName}`;
  $('modalDesc').textContent = combo.description;
  $('modalMove').innerHTML = `<b style="color:${combo.primaryColor}">${esc(combo.movementTitle)}</b> — ${esc(combo.moveLabel)} · ${esc(combo.stayLabel)}`;
  $('modalMission').innerHTML = `<b style="color:${combo.primaryColor}">${esc(combo.missionTitle)}</b> — ${esc(combo.missionLabel)}을 가장 좋아해요`;
  $('modalProps').textContent = combo.props.join(' · ');
  $('modalKws').innerHTML = combo.personalityKeywords.map((k) => `<span style="background:${combo.primaryColor}">#${esc(k)}</span>`).join('');
  $('modalGo').style.background = combo.primaryColor;
  const av = $('modalAvatar');
  av.innerHTML = '';
  av.appendChild(characterAvatarEl({ combo, imgPromise: characterImage(ch), size: 170 }));
  wrap.classList.add('open');
  $('modalGo').focus();
}

function closeModal() {
  wrap.classList.remove('open');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

$('modalX').addEventListener('click', closeModal);
$('modalClose2').addEventListener('click', closeModal);
$('modalBack').addEventListener('click', closeModal);
$('modalGo').addEventListener('click', () => {
  if (!curCombo) return;
  const av = loadAvatar();
  av.gender = gender;
  av.gear = curCombo.id; // 지도 아바타가 이 유형의 후드·귀·소품을 착용
  saveAvatar(av);
  toast(`${curCombo.animalEmoji} ${curCombo.koreanName}${iEyo(curCombo.koreanName)}! 지도로 이동해요`);
  setTimeout(() => { location.href = 'index.html'; }, 700);
});

document.addEventListener('keydown', (e) => {
  if (!wrap.classList.contains('open')) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key !== 'Tab') return;
  /* focus trap — 모달 안 tabbable 순환 */
  const items = [...modal.querySelectorAll('button, a[href]')].filter((x) => !x.disabled);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

syncControls();
renderGrid();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
